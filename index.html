<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te quiero mucho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --sky-top:#0a0b2e;
    --sky-mid:#1b1454;
    --sky-bottom:#2f1b6b;
    --glow-pink:#ff6fd8;
    --glow-violet:#b06bff;
    --petal-light:#ffe873;
    --petal-mid:#ffc94d;
    --petal-deep:#f2a93c;
    --disk-light:#8a5a2e;
    --disk-dark:#2e180a;
    --leaf:#3f9d5e;
    --leaf-light:#5cc27d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:var(--sky-top);
    font-family:'Poppins',sans-serif;
  }

  #sky{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at 50% 100%, var(--sky-bottom) 0%, var(--sky-mid) 45%, var(--sky-top) 100%);
    overflow:hidden;
  }

  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.85;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.25; transform:scale(1);}
    50%{opacity:1; transform:scale(1.6);}
  }

  .shooting-star{
    position:absolute;
    width:140px;
    height:2px;
    background:linear-gradient(90deg, #fff, rgba(255,255,255,0));
    border-radius:2px;
    opacity:0;
    transform:rotate(-18deg);
    animation:shoot 5.5s linear infinite;
  }
  @keyframes shoot{
    0%{opacity:0; transform:translate(0,0) rotate(-18deg);}
    3%{opacity:1;}
    18%{opacity:0; transform:translate(-420px,150px) rotate(-18deg);}
    100%{opacity:0;}
  }

  #heart-canvas{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:9vh 6vw 4vh;
    text-align:center;
    overflow-y:auto;
  }

  h1{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    color:#fdf1ff;
    font-size:clamp(2.6rem, 9vw, 4.6rem);
    margin:0 0 .2em;
    text-shadow:
      0 0 12px var(--glow-pink),
      0 0 34px var(--glow-violet),
      0 0 70px rgba(176,107,255,.55);
    letter-spacing:.01em;
  }

  .subtitle{
    color:#e7ddff;
    font-weight:300;
    font-size:clamp(.85rem, 2.6vw, 1.05rem);
    max-width:32ch;
    line-height:1.6;
    opacity:.85;
    margin:0 0 5vh;
  }

  .bouquet-wrap{
    position:relative;
    width:min(78vw, 320px);
    margin-top:auto;
  }

  .card{
    background:linear-gradient(160deg,#fdeaf6,#f8d2ec);
    border-radius:18px 18px 90px 90px / 18px 18px 60px 60px;
    box-shadow:0 20px 45px rgba(10,5,40,.55);
    padding-top:38%;
  }

  svg.bouquet{
    position:absolute;
    left:50%;
    bottom:52%;
    transform:translateX(-50%);
    width:88%;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
  }

  .flower-stem{ transform-origin:bottom center; animation:sway 4.5s ease-in-out infinite; }
  .flower-stem:nth-child(odd){ animation-duration:5.2s; }
  .flower-stem:nth-child(3n){ animation-duration:3.8s; animation-delay:.4s; }
  @keyframes sway{
    0%,100%{ transform:rotate(-1.4deg); }
    50%{ transform:rotate(1.4deg); }
  }

  .signature{
    margin-top:2.4vh;
    color:#cfc2ff;
    font-family:'Dancing Script', cursive;
    font-size:1.3rem;
    opacity:.9;
  }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    color:rgba(255,255,255,.35);
    font-size:.7rem;
    padding-bottom:1.2vh;
    letter-spacing:.05em;
  }

  @media (prefers-reduced-motion: reduce){
    .star,.shooting-star,.flower-stem{ animation:none !important; }
  }

  @media (max-height: 560px){
    .stage{ padding-top:4vh; padding-bottom:2vh; justify-content:flex-start; }
    h1{ font-size:clamp(1.8rem, 6vw, 2.6rem); margin-bottom:.15em; }
    .subtitle{ margin-bottom:2vh; }
    .bouquet-wrap{ width:min(46vh, 220px); }
    .signature{ margin-top:1vh; font-size:1.05rem; }
    footer{ display:none; }
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="heart-canvas"></canvas>

<div class="stage">
  <h1>Ti amo muco mi niña</h1>
  <p class="subtitle">Entre tantas estrellas, elegí quedarme mirando la tuya.</p>

  <div class="bouquet-wrap">
    <svg class="bouquet" viewBox="0 0 300 270" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="stemGradBack" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1f6b3a"/>
          <stop offset="100%" stop-color="#2d8a4c"/>
        </linearGradient>
        <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--leaf-light)"/>
          <stop offset="100%" stop-color="var(--leaf)"/>
        </linearGradient>
      </defs>

      <g class="flower-stem" style="animation-delay:.6s">
        <path d="M100 258 C100 208 108 168 118 138" stroke="url(#stemGradBack)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M107 190 C86 188 72 205 66 222 C88 216 102 206 110 196 Z" fill="url(#leafGrad)"/>
        <path d="M107 190 L104 213" stroke="#2c7a45" stroke-width="1" opacity=".6"/>
        <g class="head-slot" data-cx="118" data-cy="138" data-scale=".82" data-rot="-6"></g>
      </g>

      <g class="flower-stem" style="animation-delay:0s">
        <path d="M200 258 C200 208 194 168 186 138" stroke="url(#stemGradBack)" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M193 190 C214 188 228 205 234 222 C212 216 198 206 190 196 Z" fill="url(#leafGrad)"/>
        <path d="M193 190 L196 213" stroke="#2c7a45" stroke-width="1" opacity=".6"/>
        <g class="head-slot" data-cx="186" data-cy="138" data-scale=".82" data-rot="6"></g>
      </g>

      <g class="flower-stem" style="animation-delay:.3s">
        <path d="M68 258 C72 214 86 184 103 158" stroke="url(#stemGradBack)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M92 205 C74 208 62 224 58 238 C76 230 88 220 96 210 Z" fill="url(#leafGrad)"/>
        <g class="head-slot" data-cx="104" data-cy="156" data-scale=".68" data-rot="-14"></g>
      </g>

      <g class="flower-stem" style="animation-delay:.9s">
        <path d="M232 258 C228 214 214 184 197 158" stroke="url(#stemGradBack)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M208 205 C226 208 238 224 242 238 C224 230 212 220 204 210 Z" fill="url(#leafGrad)"/>
        <g class="head-slot" data-cx="196" data-cy="156" data-scale=".68" data-rot="14"></g>
      </g>

      <g class="flower-stem" style="animation-delay:.1s">
        <path d="M150 258 C150 200 150 155 150 118" stroke="url(#stemGradBack)" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M150 178 C122 178 106 200 100 218 C124 210 140 198 150 186 Z" fill="url(#leafGrad)"/>
        <path d="M150 178 C178 178 194 200 200 218 C176 210 160 198 150 186 Z" fill="url(#leafGrad)"/>
        <path d="M150 178 L150 205" stroke="#2c7a45" stroke-width="1.2" opacity=".6"/>
        <g class="head-slot" data-cx="150" data-cy="118" data-scale="1" data-rot="0"></g>
      </g>
    </svg>
    <div class="card"></div>
  </div>

  <p class="signature">con cariño, para ti</p>
</div>

<footer>hecho con código y un poco de magia</footer>

<script>
  // ---- Cielo: estrellas fijas ----
  const sky = document.getElementById('sky');
  const STAR_COUNT = 90;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*70 + '%';
    s.style.animationDelay = (Math.random()*3).toFixed(2) + 's';
    s.style.width = s.style.height = (Math.random()*2 + 1).toFixed(1) + 'px';
    sky.appendChild(s);
  }
  const SHOOT_COUNT = 4;
  for(let i=0;i<SHOOT_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'shooting-star';
    s.style.top = (Math.random()*35 + 5) + '%';
    s.style.left = (Math.random()*40 + 40) + '%';
    s.style.animationDelay = (Math.random()*6).toFixed(2) + 's';
    sky.appendChild(s);
  }

  // ---- Girasoles: cabezas generadas con pétalos + disco de semillas ----
  (function drawSunflowers(){
    const svgNS = 'http://www.w3.org/2000/svg';
    const bouquet = document.querySelector('svg.bouquet');
    if(!bouquet) return;

    function makeSunflower(scale){
      const g = document.createElementNS(svgNS,'g');
      const centerR = 9;

      const glow = document.createElementNS(svgNS,'circle');
      glow.setAttribute('cx',0); glow.setAttribute('cy',0);
      glow.setAttribute('r', centerR + 15);
      glow.setAttribute('fill', '#ffdf82');
      glow.setAttribute('opacity', '0.28');
      glow.setAttribute('filter', 'url(#sunGlow)');
      g.appendChild(glow);

      const outerCount = 13;
      for(let i=0;i<outerCount;i++){
        const angle = (360/outerCount)*i;
        const p = document.createElementNS(svgNS,'ellipse');
        p.setAttribute('cx',0);
        p.setAttribute('cy', -(centerR+11));
        p.setAttribute('rx',5.4);
        p.setAttribute('ry',13);
        p.setAttribute('fill','url(#petalGradOuter)');
        p.setAttribute('stroke','#e08a1f');
        p.setAttribute('stroke-width','.4');
        p.setAttribute('transform', `rotate(${angle})`);
        g.appendChild(p);
      }

      const innerCount = 12;
      for(let i=0;i<innerCount;i++){
        const angle = (360/innerCount)*i + (360/innerCount)/2;
        const p = document.createElementNS(svgNS,'ellipse');
        p.setAttribute('cx',0);
        p.setAttribute('cy', -(centerR+7.5));
        p.setAttribute('rx',4.2);
        p.setAttribute('ry',9.5);
        p.setAttribute('fill','url(#petalGradInner)');
        p.setAttribute('transform', `rotate(${angle})`);
        g.appendChild(p);
      }

      const disk = document.createElementNS(svgNS,'circle');
      disk.setAttribute('cx',0); disk.setAttribute('cy',0);
      disk.setAttribute('r', centerR);
      disk.setAttribute('fill','url(#centerGrad)');
      g.appendChild(disk);

      const seedCount = 46;
      for(let i=0;i<seedCount;i++){
        const ang = i * 137.508 * Math.PI/180;
        const r = centerR * Math.sqrt(i/seedCount) * 0.9;
        const sx = r*Math.cos(ang), sy = r*Math.sin(ang);
        const dot = document.createElementNS(svgNS,'circle');
        dot.setAttribute('cx', sx.toFixed(2));
        dot.setAttribute('cy', sy.toFixed(2));
        dot.setAttribute('r', 0.85);
        dot.setAttribute('fill', i%3===0 ? '#2a160b' : '#4a2c17');
        g.appendChild(dot);
      }

      const rim = document.createElementNS(svgNS,'circle');
      rim.setAttribute('cx',0); rim.setAttribute('cy',0);
      rim.setAttribute('r', centerR);
      rim.setAttribute('fill','none');
      rim.setAttribute('stroke','#241207');
      rim.setAttribute('stroke-width','.7');
      rim.setAttribute('opacity','.55');
      g.appendChild(rim);

      return g;
    }

    const defs = bouquet.querySelector('defs');
    defs.insertAdjacentHTML('beforeend', `
      <filter id="sunGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
      <linearGradient id="petalGradOuter" x1="0.5" y1="1" x2="0.5" y2="0">
        <stop offset="0%" stop-color="var(--petal-deep)"/>
        <stop offset="55%" stop-color="var(--petal-mid)"/>
        <stop offset="100%" stop-color="var(--petal-light)"/>
      </linearGradient>
      <linearGradient id="petalGradInner" x1="0.5" y1="1" x2="0.5" y2="0">
        <stop offset="0%" stop-color="#e2841f"/>
        <stop offset="55%" stop-color="var(--petal-mid)"/>
        <stop offset="100%" stop-color="var(--petal-light)"/>
      </linearGradient>
      <radialGradient id="centerGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="var(--disk-light)"/>
        <stop offset="55%" stop-color="#5c3517"/>
        <stop offset="100%" stop-color="var(--disk-dark)"/>
      </radialGradient>
    `);

    document.querySelectorAll('.head-slot').forEach(slot=>{
      const cx = slot.dataset.cx, cy = slot.dataset.cy;
      const scale = slot.dataset.scale || 1;
      const rot = slot.dataset.rot || 0;
      const head = makeSunflower(scale);
      head.setAttribute('transform', `translate(${cx} ${cy}) rotate(${rot}) scale(${scale})`);
      slot.appendChild(head);
    });
  })();

  // ---- Corazón de partículas en 3D ----
  try{
    const canvas = document.getElementById('heart-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 40;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

    const geometry = new THREE.BufferGeometry();
    const particleCount = 3200;
    const positions = new Float32Array(particleCount*3);

    for(let i=0;i<particleCount;i++){
      const t = Math.random() * Math.PI * 2;
      const scale = 0.9 + Math.random()*0.15;
      const x = 16 * Math.pow(Math.sin(t),3) * scale;
      const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * scale;
      const z = (Math.random()-0.5) * 8;

      positions[i*3]   = x * 0.55;
      positions[i*3+1] = y * 0.55 + 4;
      positions[i*3+2] = z;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));

    const material = new THREE.PointsMaterial({
      color: 0xff7fd6,
      size: 0.35,
      transparent:true,
      opacity:0.85,
      blending: THREE.AdditiveBlending,
      depthWrite:false
    });

    const heart = new THREE.Points(geometry, material);
    heart.position.y = 6;
    scene.add(heart);

    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e)=>{
      mouseX = (e.clientX/window.innerWidth - 0.5);
      mouseY = (e.clientY/window.innerHeight - 0.5);
    });

    let t0 = 0;
    function animate(){
      requestAnimationFrame(animate);
      t0 += 0.01;
      heart.rotation.y += (mouseX*0.6 - heart.rotation.y*0.05) * 0.05;
      heart.rotation.x += ( -mouseY*0.3 - heart.rotation.x*0.05) * 0.05;
      const pulse = 1 + Math.sin(t0*2)*0.03;
      heart.scale.set(pulse,pulse,pulse);
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }catch(e){
    console.warn('No se pudo iniciar la animación 3D', e);
  }
</script>
</body>
</html>
